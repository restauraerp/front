name: front-deploy

# Deploys this Next.js app to the production EC2 box on every tag that
# starts with "v" (e.g. v1.0.0, v2025.06.18).
#
# Where configuration lives
# -------------------------
# One place: /var/www/front/shared/.env on the deploy host. This workflow
# PULLS that file down and builds against it; it never writes it.
#
# It has to be pulled rather than merely mounted at runtime because Next
# replaces every `process.env.NEXT_PUBLIC_*` with a literal string during
# `next build`. A variable that is absent while building is not late - it is
# gone, compiled into the bundle as an empty string.
#
# This used to be split between a FRONT_ENV repo secret and a hardcoded `env:`
# block below. The secret was never set, the fallback was a `touch` that left
# the host file untouched and the build env empty, and so three months of
# green deploys shipped a bundle with no NEXT_PUBLIC_WEBSITE_URL: the trial
# and demo upgrade banner rendered nothing, Google Maps autocomplete had no
# key, and the Meta pixel never fired. Nothing failed, because nothing checked.
#
# Two things stop that recurring:
#   - the build fetches the real env file, or fails
#   - `npm run build` runs scripts/check-public-env.mjs first, which fails on
#     a missing required NEXT_PUBLIC_* rather than compiling it away
#
# To change configuration: edit /var/www/front/shared/.env on the host, then
# re-run this workflow (or cut a tag). A restart alone will not do it.
#
# Required repo secrets:
#   PUBLIC_DEPLOY_SSH_KEY  - publicdeploy's private key (terraform output -raw
#                            publicdeploy_ssh_private_key, from infra/)
#   DEPLOY_HOST            - instance public IP or domain (terraform output -raw
#                            public_ip)
#   DEPLOY_USER            - optional; defaults to "publicdeploy"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: front-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'publicdeploy' }}
      RELEASE: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # Before the build, not after: the build needs the host's env file.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PUBLIC_DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch build environment from the deploy host
        run: |
          set -euo pipefail

          # `cat` on a missing file exits non-zero, which -o pipefail turns
          # into a failed step. That is the point: an empty build env must
          # stop the deploy, never quietly produce a bundle without one.
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat /var/www/front/shared/.env" > .env.production

          if [ ! -s .env.production ]; then
            echo "::error::/var/www/front/shared/.env on $DEPLOY_HOST is empty."
            echo "::error::It is the only source of build-time configuration - populate it from .env.example."
            exit 1
          fi

          # Names only. The values are about to be compiled into a public
          # bundle, but the log is a worse place for them than the bundle.
          echo "Building with:"
          grep -oE '^[A-Z_]+' .env.production | sed 's/^/  /'

      - name: Install dependencies and build
        # No NEXT_PUBLIC_* here on purpose. Anything exported into the job
        # environment silently outranks .env.production, which is how the two
        # drifted apart in the first place.
        run: |
          npm ci
          npm run build

      - name: Upload release
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /var/www/front/releases/$RELEASE"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='.env' --exclude='.env.production' --exclude='tests' \
            --exclude='.idea' --exclude='.claude' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/front/releases/$RELEASE/"

      - name: Activate release (link shared, npm install, flip current, restart)
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE='$RELEASE' bash -s" <<'DEPLOY'
          set -euo pipefail
          APP=/var/www/front
          REL="$APP/releases/$RELEASE"

          # Wire persistent state from shared/ into this release. Serves the
          # server side only - the client bundle was fixed at build time - but
          # keeps `next start` reading the same file the build read.
          ln -sfn "$APP/shared/.env" "$REL/.env"

          cd "$REL"

          # Next.js requires production dependencies to start
          npm ci --omit=dev

          # Atomic cutover.
          ln -sfn "$REL" "$APP/current"

          # PM2 caches the cwd it resolves at `pm2 start` time (Node's
          # process.cwd() follows the "current" symlink to its real path at
          # startup), so `pm2 restart` alone would keep re-launching whatever
          # release was live the very first time this ran, never picking up
          # later deploys. Delete and recreate every time so cwd is
          # re-resolved against the freshly-flipped "current" symlink.
          pm2 delete front > /dev/null 2>&1 || true
          cd "$APP/current" && pm2 start npm --name "front" -- start
          pm2 save

          # Keep the 5 most recent releases; delete older ones.
          cd "$APP/releases"
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          echo "Deployed $RELEASE"
          DEPLOY
